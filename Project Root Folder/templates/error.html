<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} - PlaceHub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg-body: #0b0f19; --bg-surface: #111522; --border-color: #1f2537; --text-main: #f3f4f6; --text-muted: #9ca3af; --accent-gradient: linear-gradient(135deg, #7c3aed 0%, #3b82f6 100%); }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-body); color: var(--text-main); display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
        
        .error-code { font-size: 120px; font-weight: 800; background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; line-height: 1; margin-bottom: 24px; letter-spacing: -2px; }
        
        .card { background-color: var(--bg-surface); border: 1px solid var(--border-color); border-radius: 16px; padding: 48px; text-align: center; width: 100%; max-width: 450px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); }
        .icon-wrapper { width: 48px; height: 48px; border-radius: 12px; background: rgba(239, 68, 68, 0.1); color: #ef4444; display: flex; align-items: center; justify-content: center; margin: 0 auto 24px; }
        .icon-wrapper svg { width: 24px; height: 24px; fill: currentColor; }
        
        h1 { font-size: 20px; font-weight: 600; margin-bottom: 12px; color: #fff; }
        p { color: var(--text-muted); font-size: 14px; line-height: 1.6; margin-bottom: 32px; }
        
        .btn { width: 100%; padding: 12px; border-radius: 8px; font-weight: 500; font-size: 14px; cursor: pointer; display: inline-flex; justify-content: center; align-items: center; gap: 8px; transition: 0.2s; text-decoration: none; margin-bottom: 12px; border: none; }
        .btn-primary { background: var(--accent-gradient); color: #fff; }
        .btn-primary:hover { opacity: 0.9; }
        .btn-dark { background: var(--bg-body); border: 1px solid var(--border-color); color: #fff; }
        .btn-dark:hover { background: var(--bg-surface-hover); }
        .btn-ghost { color: var(--text-muted); background: transparent; }
        .btn-ghost:hover { color: #fff; }
        
        .footer-text { margin-top: 32px; font-size: 12px; color: var(--text-muted); }
        .footer-text a { color: #818cf8; text-decoration: none; }
        .footer-text a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="error-code">{{ code }}</div>
    <div class="card">
        <div class="icon-wrapper">
            <svg viewBox="0 0 24 24">
                {% if code == '404' %}
                <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 12.01 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 12.01 14 9.5 14z"/>
                {% else %}
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
                {% endif %}
            </svg>
        </div>
        <h1>{{ title }}</h1>
        <p>{{ message }}</p>
        
        <button onclick="window.location.reload();" class="btn btn-primary"><svg viewBox="0 0 24 24" style="width:16px;fill:currentColor;"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg> Try Again</button>
        <a href="/" class="btn btn-dark"><svg viewBox="0 0 24 24" style="width:16px;fill:currentColor;"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg> Back to Home</a>
        <button onclick="history.back()" class="btn btn-ghost">&larr; Go Back</button>
    </div>
    <div class="footer-text">If this persists, contact <a href="mailto:support@institute.edu">support</a></div>
</body>
</html>
